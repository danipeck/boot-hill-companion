<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f2e9" />
    <script>
      (() => {
        let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          const saved = localStorage.getItem('boot-hill.theme.v1');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#191c18' : '#f6f2e9';
      })();
    </script>
    <meta name="description" content="A little less arithmetic. A little more Wild West. Your Boot Hill 2e character sheet, combat calculator, and percentile dice roller." />
    <title>Boot Hill · The Gunslinger's Companion</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
